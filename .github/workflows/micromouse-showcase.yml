name: Micromouse Showcase

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: micromouse-showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  showcase-ci:
    name: Showcase CI
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: micromouse-showcase

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: micromouse-showcase/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Build production site
        run: npm run build

      - name: Build Docker image
        run: docker build --tag micromouse-showcase:ci .

  publish-image:
    name: Publish Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: showcase-ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ./micromouse-showcase
          push: true
          tags: |
            ghcr.io/randomrunt/micromouse-showcase:latest
            ghcr.io/randomrunt/micromouse-showcase:${{ github.sha }}

  publish-pages:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: showcase-ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: micromouse-showcase

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: micromouse-showcase/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages site
        run: npm run build
        env:
          VITE_BASE_PATH: /UNSWMicromouseDemo/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: micromouse-showcase/dist

      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v5
